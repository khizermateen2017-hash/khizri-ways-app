<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Warm Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD36A"/>
      <stop offset="40%" stop-color="#EAA838"/>
      <stop offset="100%" stop-color="#CA861B"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#05281E" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#logoShadow)">
    <!-- Golden Mihrab Arch Frame -->
    <path d="
      M 50 125 
      L 50 115 
      C 50 62, 120 32, 120 32 
      C 120 32, 190 62, 190 115 
      L 190 125 
      L 174 125 
      L 174 115 
      C 174 74, 120 50, 120 50 
      C 120 50, 66 74, 66 115 
      L 66 125 
      Z" 
      fill="url(#goldGradient)"
    />

    <!-- White Mosque Silhouette Inside Golden Arch -->
    <!-- Main Central Dome -->
    <path d="M 88 128 C 88 92, 152 92, 152 128 Z" fill="#FFFFFF"/>
    <!-- Dome Spire with Crescent -->
    <rect x="118.5" y="78" width="3" height="16" fill="#FFFFFF"/>
    <circle cx="120" cy="76" r="2.2" fill="#FFFFFF"/>
    <path d="M 120 71 A 3.5 3.5 0 1 0 120 78 A 2.6 2.6 0 1 1 120 71 Z" fill="#EAA838"/>

    <!-- Left Minaret -->
    <rect x="73" y="86" width="9" height="42" fill="#FFFFFF"/>
    <!-- Minaret Balcony -->
    <rect x="71" y="98" width="13" height="4" rx="1" fill="#FFFFFF"/>
    <polygon points="77.5,72 73,86 82,86" fill="#FFFFFF"/>
    <circle cx="77.5" cy="70" r="1.5" fill="#FFFFFF"/>
    <!-- Minaret Arched Window -->
    <path d="M 75 106 A 2.2 2.2 0 0 1 80 106 L 80 112 L 75 112 Z" fill="#0D5C46"/>

    <!-- Open Quran Book Stand (Rehal) Base -->
    <!-- Top Open Book Leaves in Warm Gold -->
    <!-- Left Leaf -->
    <polygon points="120,122 45,98 58,132 120,148" fill="#FCD36A"/>
    <!-- Right Leaf -->
    <polygon points="120,122 195,98 182,132 120,148" fill="#EAA838"/>

    <!-- White Book Pages Highlight -->
    <polygon points="120,126 50,103 48,109 120,135" fill="#FFFFFF"/>
    <polygon points="120,126 190,103 192,109 120,135" fill="#FFFFFF"/>

    <!-- Crossing Legs / Ribbons (Rehal Wooden Stand) in Pure White -->
    <!-- Upper Left to Lower Right Leg -->
    <path d="M 58 142 L 110 166 L 98 178 L 52 154 Z" fill="#FFFFFF"/>
    <!-- Upper Right to Lower Left Leg -->
    <path d="M 182 142 L 130 166 L 142 178 L 188 154 Z" fill="#FFFFFF"/>
    <!-- Lower Crossing Legs -->
    <path d="M 80 160 L 120 174 L 116 186 L 68 172 Z" fill="#FFFFFF"/>
    <path d="M 160 160 L 120 174 L 124 186 L 172 172 Z" fill="#FFFFFF"/>
  </g>
</svg>
