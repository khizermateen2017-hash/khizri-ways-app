<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Circular Outer Border -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#253A33" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="#253A33" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Ornate Crest Ribbon / Arch Top -->
  <path d="M 28 36 C 36 28, 64 28, 72 36" fill="none" stroke="#253A33" stroke-width="1.8"/>

  <!-- Open Quran / Book -->
  <path d="M 50 56 Q 36 50 26 53 L 26 67 Q 36 64 50 70 Z" fill="#253A33" opacity="0.85"/>
  <path d="M 50 56 Q 64 50 74 53 L 74 67 Q 64 64 50 70 Z" fill="#253A33" opacity="0.85"/>
  <line x1="50" y1="56" x2="50" y2="70" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Rays of Light Shining from the Quran -->
  <line x1="50" y1="48" x2="50" y2="38" stroke="#253A33" stroke-width="1.5"/>
  <line x1="43" y1="49" x2="36" y2="42" stroke="#253A33" stroke-width="1.5"/>
  <line x1="57" y1="49" x2="64" y2="42" stroke="#253A33" stroke-width="1.5"/>
  <line x1="38" y1="53" x2="30" y2="48" stroke="#253A33" stroke-width="1.5"/>
  <line x1="62" y1="53" x2="70" y2="48" stroke="#253A33" stroke-width="1.5"/>

  <!-- Crescent & Star at the Top -->
  <path d="M 52 24 A 5 5 0 1 0 52 32 A 4 4 0 1 1 52 24 Z" fill="#253A33"/>
  <polygon points="54,27 55,29 57,29 55.5,30.5 56,32.5 54,31 52,32.5 52.5,30.5 51,29 53,29" fill="#253A33" transform="scale(0.6) translate(36, 17)"/>

  <!-- Circular Decorative Dots -->
  <circle cx="20" cy="50" r="1.5" fill="#253A33"/>
  <circle cx="80" cy="50" r="1.5" fill="#253A33"/>
  <circle cx="50" cy="80" r="1.5" fill="#253A33"/>
</svg>
